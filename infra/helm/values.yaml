# Default values for fastapi-react-app
replicaCount: 2

image:
  repository: sajanv88/fastapi-react-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: 
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: your-app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fastapi-react-tls
      hosts:
        - your-app.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  - name: MONGO_URI
    value: "mongodb://mongodb:27017"
  - name: MONGO_DB_NAME
    value: "fastapi_app"
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: jwt-secret
  - name: REFRESH_TOKEN_SECRET
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: refresh-token-secret
  - name: SMTP_HOST
    value: "smtp.gmail.com"
  - name: SMTP_PORT
    value: "587"
  - name: SMTP_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: smtp-user
  - name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: smtp-password
  - name: SMTP_MAIL_FROM
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: smtp-mail-from
  # The backend reads HOST_MAIN_DOMAIN (see backend/.env.example), not
  # BASE_URL: it gates tenant-subdomain validation and SSO redirects.
  # Keep this in sync with the ingress host above.
  - name: HOST_MAIN_DOMAIN
    value: "your-app.example.com"
  # The backend defaults FASTAPI_ENV to "development", which builds SSO
  # redirect URIs as http://<domain>:3000 (the Vite dev server), leaves
  # auth cookies without Secure, and allows dev data seeding. This chart
  # serves production traffic behind a TLS ingress, so pin production.
  - name: FASTAPI_ENV
    value: "production"
  # Settings() in backend/api/core/config.py requires these fields even
  # when the feature is unused (Coolify is disabled by default, and
  # Stripe/AWS keys are only consumed when billing/uploads run), so a
  # Helm pod without them fails validation at import and crash-loops.
  # Replace every placeholder below with a real value before enabling
  # the corresponding feature; the placeholders only let the pod start.
  - name: COOLIFY_API_URL
    value: "https://your-coolify.example.com/api/v1"
  - name: COOLIFY_API_KEY
    value: "your-coolify-api-key"
  - name: COOLIFY_APPLICATION_ID
    value: "your-coolify-application-id"
  - name: AWS_ACCESS_KEY_ID
    value: "your-aws-access-key-id"
  - name: AWS_SECRET_ACCESS_KEY
    value: "your-aws-secret-access-key"
  - name: STRIPE_API_KEY
    value: "your-stripe-api-key"
  - name: STRIPE_SECRET_KEY
    value: "your-stripe-secret-key"
  - name: STRIPE_WEBHOOK_SECRET
    value: "your-stripe-webhook-secret"

# Health checks
livenessProbe:
  httpGet:
    path: /api/v1/health/
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/health/
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# MongoDB dependency
mongodb:
  enabled: true
  auth:
    enabled: false
  persistence:
    enabled: true
    size: 8Gi
